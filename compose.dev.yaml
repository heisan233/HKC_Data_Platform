services:
  platform:
    command:
      - sh
      - -c
      - >-
        python -m app.cli.init_mysql &&
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - type: bind
        source: ./app
        target: /opt/hkc-platform/app
        read_only: true
      - type: bind
        source: ./migrations
        target: /opt/hkc-platform/migrations
        read_only: true
