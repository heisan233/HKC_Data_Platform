services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: hkc-data-platform:v2
    init: true
    environment:
      HKC_DATA_ROOT: /data
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_API_TOKEN: ${VLM_API_TOKEN:-EMPTY}
      QC_DOCTOR_TIMEOUT_SECONDS: ${QC_DOCTOR_TIMEOUT_SECONDS:-1800}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - type: bind
        source: ./storage
        target: /data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    restart: unless-stopped
