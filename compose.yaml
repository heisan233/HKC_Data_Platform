services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${HKC_MYSQL_DATABASE:-hkc_platform}
      MYSQL_USER: ${HKC_MYSQL_USER:-hkc_app}
      MYSQL_PASSWORD: ${HKC_MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${HKC_MYSQL_ROOT_PASSWORD:-}
    volumes:
      - type: bind
        source: ${HKC_MYSQL_DATA_PATH:-./mysql-data}
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  platform:
    depends_on:
      mysql:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
    image: ${HKC_IMAGE:-hkc-data-platform:v3.1}
    init: true
    environment:
      HKC_DATA_ROOT: /data
      HKC_MYSQL_HOST: mysql
      HKC_MYSQL_PORT: 3306
      HKC_MYSQL_DATABASE: ${HKC_MYSQL_DATABASE:-hkc_platform}
      HKC_MYSQL_USER: ${HKC_MYSQL_USER:-hkc_app}
      HKC_MYSQL_PASSWORD: ${HKC_MYSQL_PASSWORD:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_API_TOKEN: ${VLM_API_TOKEN:-EMPTY}
      QC_DOCTOR_TIMEOUT_SECONDS: ${QC_DOCTOR_TIMEOUT_SECONDS:-1800}
      HKC_MAX_UPLOAD_BYTES: ${HKC_MAX_UPLOAD_BYTES:-10737418240}
      HKC_MAX_EXPANDED_BYTES: ${HKC_MAX_EXPANDED_BYTES:-53687091200}
      HKC_MAX_ARCHIVE_FILES: ${HKC_MAX_ARCHIVE_FILES:-200000}
    ports:
      - name: web
        target: 8000
        published: "8000"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ${HKC_STORAGE_PATH:-./storage}
        target: /data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
