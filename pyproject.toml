[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hkc-data-platform"
version = "0.1.0"
description = "HKC robot dataset management platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av==15.0.0",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "python-multipart==0.0.32",
    "starlette==1.6.0",
    "uvicorn[standard]==0.53.0",
    "lerobot-doctor==0.2.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
