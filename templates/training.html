{% extends "base.html" %}
{% block page_title %}模型训练{% endblock %}
{% block content %}
<div class="flex mb-12">
    <div><span class="text-muted">🧠 训练任务、参数配置、指标监控、检查点管理</span></div>
    <button class="btn btn-primary">+ 新建训练任务</button>
</div>
<div class="card">
    <table class="table">
        <tr><th>ID</th><th>任务名称</th><th>模型</th><th>数据集</th><th>状态</th><th>指标</th><th>开始</th><th>结束</th><th>操作</th></tr>
        {% for t in tasks %}
        <tr>
            <td>{{ t.id }}</td>
            <td><strong>{{ t.name }}</strong></td>
            <td><span class="tag">{{ t.model }}</span></td>
            <td>{{ t.dataset }}</td>
            <td><span class="status-badge
                {% if t.status == '已完成' %}status-done
                {% elif t.status == '运行中' %}status-running
                {% else %}status-paused{% endif %}">{{ t.status }}</span></td>
            <td>{{ t.metric }}</td>
            <td>{{ t.start }}</td>
            <td>{{ t.end }}</td>
            <td>
                <button class="btn btn-primary btn-sm">查看</button>
                <button class="btn btn-sm" style="background:#f0f0f0;">日志</button>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
