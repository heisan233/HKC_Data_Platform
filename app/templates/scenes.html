{% extends "base.html" %}
{% block page_title %}情景管理{% endblock %}
{% block content %}
<div class="flex mb-12"><div></div><button class="btn btn-primary">+ 新建情景</button></div>
<div class="card">
    <table class="table">
        <tr><th>ID</th><th>情景名称</th><th>关联机器人</th><th>涉及技能</th><th>状态</th><th>进度</th><th>操作</th></tr>
        {% for s in scenes %}
        <tr>
            <td>{{ s.id }}</td>
            <td><strong>{{ s.name }}</strong></td>
            <td>{{ s.robot }}</td>
            <td>{% for sk in s.skills %}<span class="tag">{{ sk }}</span>{% endfor %}</td>
            <td><span class="status-badge
                {% if s.status == '已完成' %}status-done
                {% elif s.status == '采集中' %}status-running
                {% elif s.status == '质检中' %}status-paused
                {% else %}status-running{% endif %}">{{ s.status }}</span></td>
            <td>
                <div style="background:#e9edf4;border-radius:6px;height:8px;width:120px;display:inline-block;vertical-align:middle;">
                    <div style="background:#2b7de9;height:8px;border-radius:6px;width:{{ s.progress }}%;"></div>
                </div>
                <span style="font-size:12px;color:#666;margin-left:6px;">{{ s.progress }}%</span>
            </td>
            <td><button class="btn btn-primary btn-sm">查看</button> <button class="btn btn-sm" style="background:#f0f0f0;">编辑</button></td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
