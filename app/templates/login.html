<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - HKC 数采平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #fff; padding: 48px 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 380px; }
        .login-box h1 { font-size: 24px; color: #1a3c5e; text-align: center; margin-bottom: 8px; }
        .login-box .sub { color: #999; text-align: center; font-size: 14px; margin-bottom: 32px; }
        .login-box label { display: block; font-size: 14px; color: #333; margin-bottom: 4px; }
        .login-box input[type="text"], .login-box input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
        .login-box input:focus { border-color: #2b7de9; outline: none; }
        .login-box button { width: 100%; padding: 10px; background: #2b7de9; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .login-box button:hover { background: #1a6cd6; }
        .login-box .error { color: #ff4d4f; font-size: 13px; margin-top: 8px; text-align: center; }
        .login-box .error { min-height: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>HKC 数采平台</h1>
        <div class="sub">机器人数据采集与管理平台</div>
        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next_path }}">
            <label for="username">用户名</label>
            <input id="username" type="text" name="username" value="{{ username }}"
                   placeholder="请输入用户名" autocomplete="username" required autofocus>
            <label for="password">密码</label>
            <input id="password" type="password" name="password" value=""
                   placeholder="请输入密码" autocomplete="current-password" required>
            <button type="submit">登 录</button>
            <div class="error">{% if error %}{{ error }}{% endif %}</div>
        </form>
    </div>
</body>
</html>
