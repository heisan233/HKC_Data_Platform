<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改初始密码 - HKC 数采平台</title>
  <link rel="stylesheet" href="/static/css/account.css?v=20261105-1">
</head>
<body class="password-required-page">
  <main class="password-required-card">
    <span class="password-required-mark">SECURITY SETUP</span>
    <h1>请先修改初始密码</h1>
    <p>你好，{{ request.state.user.display_name }}。完成密码修改后才能使用平台其他功能。</p>
    {% if error %}<div class="account-alert account-error">{{ error }}</div>{% endif %}
    <form method="post" action="/account/password" class="account-form">
      <label>当前初始密码<input type="password" name="current_password" autocomplete="current-password" required autofocus></label>
      <label>新密码<input type="password" name="new_password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
      <label>再次输入新密码<input type="password" name="confirmation" minlength="8" maxlength="128" autocomplete="new-password" required></label>
      <button type="submit">保存新密码并重新登录</button>
    </form>
    <form method="post" action="/logout" class="password-required-logout">
      <button type="submit">退出当前账号</button>
    </form>
  </main>
</body>
</html>
